services:
  bff-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bff-java-service
    ports:
      - "8280:8080"
    environment:
      - REDIS_HOST=redisjava
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      - redisjava

  redisjava:
    image: redis:alpine
    container_name: redisjava
    ports:
      - "8301:8301"
