services:
  bff-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bff-java-service
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis_pg_new
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      - redis_pg_new

  redis_pg_new:
    image: redis:alpine
    container_name: redis_pg_new
    ports:
      - "6379:6379"
