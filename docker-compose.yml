services:
  bff-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bff-java-service
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis-cache-java
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      - redis-cache-java

  redis-cache-java:
    image: redis:alpine
    container_name: redis-cache-java
    ports:
      - "6379:6379"