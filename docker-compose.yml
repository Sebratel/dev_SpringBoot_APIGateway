services:
  # Corrige a propriedade do volume de logs antes da aplicacao subir.
  # O container roda como UID 10001 (nao-root), mas um volume nomeado que ja existia
  # pertence a root e o Docker so copia o dono da imagem em volume NOVO; sem isto o
  # logback falha com "logs/bff.log (Permission denied)" a cada subida.
  # Roda uma vez, como root, e termina. Idempotente.
  bff-logs-init:
    image: alpine:3.20
    container_name: bff-logs-init
    user: "0:0"
    restart: "no"
    command: ["chown", "-R", "10001:10001", "/logs"]
    volumes:
      - bff-logs:/logs

  bff-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sebratel/bff-sebratel:latest
    container_name: bff-java-service
    restart: unless-stopped
    depends_on:
      bff-logs-init:
        condition: service_completed_successfully
    ports:
      - "8086:8085"
    networks:
      - proxy
      - default
      # Rede do stack ELK, necessária para alcançar apm-server:8200.
      # Adicionada sem remover nenhuma das redes existentes.
      - elk-network
    environment:
      # Aplicação
      - APP_NAME=bff
      - SPRING_PROFILES_ACTIVE=default

      # Observabilidade (Elastic APM)
      # Os defaults ficam no Dockerfile; aqui só o que pode variar por ambiente.
      - ELASTIC_APM_SERVICE_NAME=${ELASTIC_APM_SERVICE_NAME:-api-gateway}
      - ELASTIC_APM_SERVER_URL=${ELASTIC_APM_SERVER_URL:-http://apm-server:8200}
      - ELASTIC_APM_ENVIRONMENT=${ELASTIC_APM_ENVIRONMENT:-production}
      - ELASTIC_APM_ENABLED=${ELASTIC_APM_ENABLED:-true}
      - ELASTIC_APM_TRANSACTION_SAMPLE_RATE=${ELASTIC_APM_TRANSACTION_SAMPLE_RATE:-1.0}

      # Auditoria de autenticação (temporária, ver findings F-02 e F-04)
      - AUTH_AUDIT_ENABLED=${AUTH_AUDIT_ENABLED:-true}

      # Segurança
      - SECURITY_USER=${SECURITY_USER}
      - SECURITY_PASS=${SECURITY_PASS}

      # Banco ERP (PostgreSQL)
      - ERP_DB_URL=${ERP_DB_URL}
      - ERP_DB_USER=${ERP_DB_USER}
      - ERP_DB_PASS=${ERP_DB_PASS}

      # Banco Radius (PostgreSQL)
      - RADIUS_DB_URL=${RADIUS_DB_URL}
      - RADIUS_DB_USER=${RADIUS_DB_USER}
      - RADIUS_DB_PASS=${RADIUS_DB_PASS}

      # Logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-logs/bff.log}

      # MariaDB
      - AFETADOS_DB_URL=${AFETADOS_DB_URL}
      - AFETADOS_DB_USER=${AFETADOS_DB_USER}
      - AFETADOS_DB_PASS=${AFETADOS_DB_PASS}

      # Usuario Integrador Elleven
      - ELLEVEN_CLIENT_ID=${ELLEVEN_CLIENT_ID}
      - ELLEVEN_CLIENT_SECRET=${ELLEVEN_CLIENT_SECRET}
      - ELLEVEN_CLIENT_SYNDATA=${ELLEVEN_CLIENT_SYNDATA}
      - ELLEVEN_CLIENT_GRANT_TYPE=${ELLEVEN_CLIENT_GRANT_TYPE}
      - ELLEVEN_CLIENT_SCOPE=${ELLEVEN_CLIENT_SCOPE}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CLIENT_SCOPE=${GOOGLE_CLIENT_SCOPE}

    volumes:
      - bff-logs:/app/logs

volumes:
  bff-logs:
    driver: local

# Declaração das redes
networks:
  proxy:
    external: true
  default:
    driver: bridge
  # Rede externa do stack ELK. Declarada aqui (e não criada manualmente no
  # Portainer) porque o ambiente é GitOps: a topologia precisa estar versionada.
  # Confirmar com:  docker compose config   ->  elk-network: name: elk_es_network
  elk-network:
    name: ${ELK_NETWORK_NAME:-elk_es_network}
    external: true
