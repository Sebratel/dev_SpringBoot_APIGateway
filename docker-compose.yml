services:
  bff-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bff-java-service
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis-cache-java
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      - redis-cache-java

  redis_pg_new:
    image: redis:alpine
    container_name: redis_pg_new
    ports:
      - "6379:6379"
