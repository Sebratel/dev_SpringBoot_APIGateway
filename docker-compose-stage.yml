version: "3.8"

services:
  gateway-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bff-java-service-stage
    restart: unless-stopped
    ports:
      - "8082:8085"
    networks:
      - proxy
    environment:
      - APP_NAME=bff
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}

      # O agente APM está sempre presente na imagem, mas fica desligado aqui:
      # este stack não está anexado à rede elk_es_network, então apm-server:8200
      # não resolveria e o agente ficaria tentando conectar em vão.
      # Para habilitar no stage: anexar o serviço à rede do ELK (como em
      # docker-compose.yml) e definir ELASTIC_APM_ENABLED=true.
      - ELASTIC_APM_ENABLED=${ELASTIC_APM_ENABLED:-false}
      - ELASTIC_APM_ENVIRONMENT=${ELASTIC_APM_ENVIRONMENT:-staging}
      - AUTH_AUDIT_ENABLED=${AUTH_AUDIT_ENABLED:-true}
      - SECURITY_USER=${SECURITY_USER}
      - SECURITY_PASS=${SECURITY_PASS}
      - ERP_DB_URL=${ERP_DB_URL}
      - ERP_DB_USER=${ERP_DB_USER}
      - ERP_DB_PASS=${ERP_DB_PASS}
      - RADIUS_DB_URL=${RADIUS_DB_URL}
      - RADIUS_DB_USER=${RADIUS_DB_USER}
      - RADIUS_DB_PASS=${RADIUS_DB_PASS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-logs/bff.log}
      - AFETADOS_DB_URL=${AFETADOS_DB_URL}
      - AFETADOS_DB_USER=${AFETADOS_DB_USER}
      - AFETADOS_DB_PASS=${AFETADOS_DB_PASS}
      - ELLEVEN_CLIENT_ID=${ELLEVEN_CLIENT_ID}
      - ELLEVEN_CLIENT_SECRET=${ELLEVEN_CLIENT_SECRET}
      - ELLEVEN_CLIENT_SYNDATA=${ELLEVEN_CLIENT_SYNDATA}
      - ELLEVEN_CLIENT_GRANT_TYPE=${ELLEVEN_CLIENT_GRANT_TYPE}
      - ELLEVEN_CLIENT_SCOPE=${ELLEVEN_CLIENT_SCOPE}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CLIENT_SCOPE=${GOOGLE_CLIENT_SCOPE}
    volumes:
      - bff-logs:/app/logs

volumes:
  bff-logs:
    driver: local

networks:
  proxy:
    external: true