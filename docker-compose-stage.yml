version: "3.8"

services:
  gateway-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bff-java-service-stage
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8082:8085"
    networks:
      - proxy
    environment:
      - APP_NAME=bff
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - SECURITY_USER=${SECURITY_USER}
      - SECURITY_PASS=${SECURITY_PASS}
      - ERP_DB_URL=${ERP_DB_URL}
      - ERP_DB_USER=${ERP_DB_USER}
      - ERP_DB_PASS=${ERP_DB_PASS}
      - RADIUS_DB_URL=${RADIUS_DB_URL}
      - RADIUS_DB_USER=${RADIUS_DB_USER}
      - RADIUS_DB_PASS=${RADIUS_DB_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-logs/bff.log}
      - AFETADOS_DB_URL=${AFETADOS_DB_URL}
      - AFETADOS_DB_USER=${AFETADOS_DB_USER}
      - AFETADOS_DB_PASS=${AFETADOS_DB_PASS}
      - ELLEVEN_CLIENT_ID=${ELLEVEN_CLIENT_ID}
      - ELLEVEN_CLIENT_SECRET=${ELLEVEN_CLIENT_SECRET}
      - ELLEVEN_CLIENT_SYNDATA=${ELLEVEN_CLIENT_SYNDATA}
      - ELLEVEN_CLIENT_GRANT_TYPE=${ELLEVEN_CLIENT_GRANT_TYPE}
      - ELLEVEN_CLIENT_SCOPE=${ELLEVEN_CLIENT_SCOPE}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CLIENT_SCOPE=${GOOGLE_CLIENT_SCOPE}
    volumes:
      - bff-logs:/app/logs

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    networks:
      - proxy
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    networks:
      - proxy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  bff-logs:
    driver: local

networks:
  proxy:
    external: true