name: Stage Deployment Pipeline

on:
  push:
    branches:
      - staging

jobs:
  check-version:
    name: "Verificar Nova Versão"
    runs-on: ubuntu-latest
    outputs:
      is_new_version: ${{ steps.version_check.outputs.is_new_version }}
      current_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Extrair Versão do pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Comparar Versão com Última Tag
        id: version_check
        run: |
          # Pega a última tag ou define 0.0.0 se não houver tags
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          
          echo "Versão Atual: $CURRENT_VERSION"
          echo "Última Tag: $LAST_TAG"
          
          if [ "$CURRENT_VERSION" == "$LAST_TAG" ]; then
            echo "is_new_version=false" >> $GITHUB_OUTPUT
            echo "A versão $CURRENT_VERSION já existe no repositório. Ignorando build."
          else
            echo "is_new_version=true" >> $GITHUB_OUTPUT
            echo "Nova versão $CURRENT_VERSION detectada!"
          fi

  build-and-test:
    name: "Build e Testes"
    needs: check-version
    if: needs.check-version.outputs.is_new_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Unitários
        run: mvn clean test

      - name: Empacotar Projeto (Jar)
        run: mvn package -DskipTests

      # Adicione aqui os passos de deploy ou push de imagem Docker se necessário
      - name: Log de Sucesso
        run: echo "Build da versão ${{ needs.check-version.outputs.current_version }} concluído com sucesso."