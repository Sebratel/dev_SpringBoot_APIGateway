name: Stage Deployment Pipeline

on:
  push:
    branches:
      - staging

jobs:
  check-version:
    name: "Verificar Nova Versão"
    runs-on: ubuntu-latest
    outputs:
      is_new_version: ${{ steps.version_check.outputs.is_new_version }}
      current_version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essencial para que o git consiga ler as tags

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Extrair Versão do pom.xml
        id: get_version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Comparar Versão com Última Tag
        id: version_check
        run: |
          # Pega a última tag. Se não existir, define 0.0.0
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          
          echo "Versão Atual: $CURRENT_VERSION"
          echo "Última Tag: $LAST_TAG"
          
          if [ "$CURRENT_VERSION" == "$LAST_TAG" ]; then
            echo "::error::A versão $CURRENT_VERSION já existe como uma tag no repositório. Atualize o pom.xml!"
            exit 1
          else
            echo "is_new_version=true" >> $GITHUB_OUTPUT
            echo "Nova versão $CURRENT_VERSION detectada!"
          fi

  build-and-test:
    name: "Build e Testes"
    needs: check-version
    # Este job só roda se o check-version passar. 
    # Se o check-version der 'exit 1', este job nem será iniciado.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Unitários e BDD
        run: ./mvnw clean verify

      - name: Empacotar Projeto (Jar)
        run: ./mvnw package -DskipTests

      - name: Log de Sucesso
        run: echo "Build da versão ${{ needs.check-version.outputs.current_version }} concluído com sucesso."
